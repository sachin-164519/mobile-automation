name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  api-tests:
    name: API test suite (Rest Assured)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The target API resets every ~10 minutes and can be slow on a cold
      # first request - a short retry-able warm-up call avoids the very
      # first real test in the run eating that cold-start latency as a
      # false-looking slow test / timeout.
      - name: Warm up target API
        run: curl -sS --retry 3 --retry-delay 5 https://restful-booker.herokuapp.com/ping || true

      - name: Run API tests
        run: mvn --batch-mode --no-transfer-progress test
        env:
          BASE_URI: https://restful-booker.herokuapp.com

      # Always publish results, including on failure, so a red build still
      # comes with a report explaining *why*.
      - name: Publish Surefire test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: API test results
          path: 'api/target/surefire-reports/*.xml'
          reporter: java-junit

      - name: Upload Surefire artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-surefire-reports
          path: api/target/surefire-reports/
          retention-days: 14

  mobile-tests:
    name: Mobile test suite (Appium)
    runs-on: ubuntu-latest
    # Intentionally not wired to actually execute Appium tests on the runner.
    # See mobile/DESIGN.md and the root README for why: a hosted Android
    # emulator on a GitHub runner is slow to boot and only covers one
    # device/OS combination. The real version of this job would swap in a
    # device-cloud provider (Sauce Labs / BrowserStack App Automate) and run
    # the exact same test code against remote capabilities instead of a
    # local emulator - no test code changes, only DriverFactory's config.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mobile suite - would run on a device cloud, not this runner
        run: |
          echo "Mobile tests target a device cloud (Sauce Labs / BrowserStack App Automate)"
          echo "rather than this runner. Wiring would look like:"
          echo "  1. Upload the APK to the provider's app storage"
          echo "  2. mvn -f mobile/pom.xml test -Dappium.server.url=<provider-hub-url> ..."
          echo "  3. Publish the provider's session report link as a build artifact"
          echo "This job exists as a placeholder so the pipeline shape is visible;"
          echo "see mobile/DESIGN.md for the full reasoning."

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [api-tests]
    if: always()
    steps:
      - name: Fail the build if the API suite failed
        if: needs.api-tests.result != 'success'
        run: |
          echo "API test suite did not pass - failing the quality gate."
          exit 1
